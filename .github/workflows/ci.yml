name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: بررسی تایپ و ساخت
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: بررسی تایپ‌ها
        run: npm run typecheck

      - name: ساخت نسخهٔ تولید
        run: npm run build

      - name: بارگذاری خروجی
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
